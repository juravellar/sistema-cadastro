version: 2
# Um PR por pasta por semana, com todas as atualizações juntas (inclusive
# versões maiores), em vez de um PR por biblioteca.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
    # Exigem Node 22; o projeto roda em Node 20 (.nvmrc, Dockerfiles, CI e
    # servidor). Remover ao atualizar o Node.
    ignore:
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: jsdom
        versions: [">=30"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
