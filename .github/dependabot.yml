version: 2
# Um PR por pasta por semana, com todas as atualizações juntas (inclusive
# versões maiores), em vez de um PR por biblioteca.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ["*"]
    # jsdom 30+ exige Node 22.22 ou mais recente, acima do mínimo do projeto
    # (22.13). Remover quando o mínimo subir.
    ignore:
      - dependency-name: jsdom
        versions: [">=30"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
