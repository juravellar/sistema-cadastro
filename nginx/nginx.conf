events {}

http {
    server {
        listen 80;

        # Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # API Proxy
        location /api/ {
            proxy_pass http://backend:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
